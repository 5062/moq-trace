[workspace]

[package]
name = "moq-trace-ctf"
description = "Native CTF-to-Arrow decoder for the MoQ trace Python package"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "_native_ctf"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
arrow-array = "58"
arrow-schema = "58"
arrow-pyarrow = "58"
pyo3 = { version = "0.28", features = ["abi3-py311"] }
serde_json = "1"

[build-dependencies]
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }
pkg-config = "0.3"
