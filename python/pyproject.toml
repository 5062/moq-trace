[build-system]
requires = ["setuptools>=77", "setuptools-rust>=1.11"]
build-backend = "setuptools.build_meta"

[project]
name = "moq-trace"
version = "0.1.0"
description = "Capture and analyze MoQ relay latency experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.14",
    "cryptography>=42",
    "dpkt>=1.9.8",
    "duckdb>=1.4",
    "matplotlib>=3.10",
    "numpy>=1.25",
    "pyarrow>=20",
    "pydantic>=2.11",
]

[project.scripts]
moq-trace = "moq_trace.run.cli:main"

[tool.setuptools.package-data]
moq_trace = ["sql/**/*.sql"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"

[[tool.setuptools-rust.ext-modules]]
target = "moq_trace._native_ctf"
path = "native/Cargo.toml"
binding = "PyO3"
features = ["extension-module"]
args = ["--locked"]
