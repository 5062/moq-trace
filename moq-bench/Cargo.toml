# The bench peers are their own workspace so `just check` never builds the MoQ
# implementation under test. They pull it from the instrumented moq branch, and
# `Cargo.lock` pins the revision; `cargo update -p moq-net -p moq-native` refreshes it.
[workspace]

[package]
name = "moq-bench"
description = "Implementation-independent MoQ reference client and server for trace measurements"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "moq-bench"
path = "src/bin/client.rs"

[[bin]]
name = "moq-bench-server"
path = "src/bin/server.rs"

[features]
default = []
# Emit moq_trace:* and quic_trace:* LTTng events from both peers. moq-net/trace
# turns on the LTTng backend, which the patched Quinn's hooks share.
lttng = ["moq-net/trace"]

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
clap = { version = "4", features = ["derive", "env"] }
humantime = "2.3"
moq-native = { git = "https://github.com/5062/moq", branch = "moq-trace", default-features = false, features = [
    "aws-lc-rs",
    "quinn",
] }
moq-net = { git = "https://github.com/5062/moq", branch = "moq-trace" }
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
url = "2"

# Both peers must resolve the same transport sources the moq workspace uses.
# Patches only apply at the workspace root, so an outside workspace has to repeat
# them or it silently builds a different Quinn and web-transport than the relays.
# The revisions match rs/trace.toml in the moq repository.
[patch.crates-io]
quic-trace = { path = "../crates/quic-trace" }
quinn = { git = "https://github.com/5062/quinn", rev = "9a8a50e49a9e4091cf2acea2d0dc7d8a9dd73492" }
quinn-proto = { git = "https://github.com/5062/quinn", rev = "9a8a50e49a9e4091cf2acea2d0dc7d8a9dd73492" }
web-transport-quinn = { git = "https://github.com/5062/web-transport", rev = "eea76bc39afacc65364dc3cd258d0b7bd98836f7" }
web-transport-trait = { git = "https://github.com/5062/web-transport", rev = "eea76bc39afacc65364dc3cd258d0b7bd98836f7" }

# moq-net takes moq-trace from git while the Quinn fork takes quic-trace from
# crates.io. Both must resolve to this checkout, or MoQ and transport hooks link
# two separate facades with unrelated identifier spaces.
[patch."https://github.com/5062/moq-trace"]
moq-trace = { path = "../crates/moq-trace" }
