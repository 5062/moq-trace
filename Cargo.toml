[workspace]
members = [
    "crates/moq-trace",
    "crates/moq-trace-lttng-sys",
    "crates/quic-trace",
    "crates/quic-trace-lttng-sys",
]
resolver = "2"

[workspace.package]
authors = ["Luke Curley"]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }
cc = "1"
libc = "0.2.189"
pkg-config = "0.3"
moq-trace = { version = "0.1.0", path = "crates/moq-trace", default-features = false }
moq-trace-lttng-sys = { version = "0.1.0", path = "crates/moq-trace-lttng-sys" }
quic-trace = { version = "0.1.0", path = "crates/quic-trace", default-features = false }
quic-trace-lttng-sys = { version = "0.1.0", path = "crates/quic-trace-lttng-sys" }
