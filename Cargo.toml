[workspace]
members = [
    "crates/moq-trace",
    "crates/moq-trace-lttng-sys",
    "crates/quic-trace",
    "crates/quic-trace-lttng-sys",
    "crates/trace-core",
    "crates/trace-provider-build",
]
# The measurement peers depend on the MoQ implementation under test, which lives
# in a sibling repository. Keeping them out of the workspace keeps
# `just check` working from a standalone toolkit checkout.
exclude = ["moq-bench"]
resolver = "2"

[workspace.package]
authors = ["Luke Curley"]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }
cc = "1"
pkg-config = "0.3"
moq-trace = { version = "0.1.0", path = "crates/moq-trace", default-features = false }
moq-trace-lttng-sys = { version = "0.1.0", path = "crates/moq-trace-lttng-sys" }
quic-trace = { version = "0.1.0", path = "crates/quic-trace", default-features = false }
quic-trace-lttng-sys = { version = "0.1.0", path = "crates/quic-trace-lttng-sys" }
trace-core = { version = "0.1.0", path = "crates/trace-core", default-features = false }
trace-provider-build = { version = "0.1.0", path = "crates/trace-provider-build" }
