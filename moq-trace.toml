# What `moq-trace bench` runs from this checkout. Relative paths resolve against
# this file's directory.

# One launch profile per relay implementation.
profiles = "python/src/moq_trace/relays"
# The version every implementation negotiates. Must match the peers' own pin in
# `moq-bench/src/lib.rs`.
protocol = "moq-transport-16"
# The reference peers, which `just moq-bench-build` writes.
bench_bin = "moq-bench/target/release/moq-bench"
# Builds the peers in a remote peer host's checkout. The flags enable flakes for
# this command alone, since a host's Nix may leave them off.
bench_build = "nix --extra-experimental-features 'nix-command flakes' develop --command just moq-bench-build"
