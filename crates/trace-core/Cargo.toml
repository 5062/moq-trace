[package]
name = "trace-core"
description = "Identity, clock, and provider plumbing shared by the MoQ and QUIC facades."
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
# Draw identifiers and time from the native provider library the C++ facade
# also links, so both languages share one set of counters and one clock.
lttng = ["dep:quic-trace-lttng-sys"]
# Add an in-process recording backend for tests. A production build leaves it
# off, so the native backend carries no recording state or branch.
recording = []

[dependencies]
quic-trace-lttng-sys = { workspace = true, optional = true }
